query AuditRodFilterMigration($ids: [ID!]!) {
  nodes(ids: $ids) {
    ... on Product {
      id
      handle
      productType
      peMin: metafield(namespace: "specs", key: "rod_pe_min") { id value }
      peMax: metafield(namespace: "specs", key: "rod_pe_max") { id value }
      castMin: metafield(namespace: "specs", key: "rod_cast_min_g") { id value }
      castMax: metafield(namespace: "specs", key: "rod_cast_max_g") { id value }
      dragMax: metafield(namespace: "specs", key: "rod_drag_max_kg") { id value }
      variants(first: 100) {
        nodes {
          id
          sku
          peMin: metafield(namespace: "specs", key: "rod_pe_min") { value }
          peMax: metafield(namespace: "specs", key: "rod_pe_max") { value }
          castMin: metafield(namespace: "specs", key: "rod_cast_min_g") { value }
          castMax: metafield(namespace: "specs", key: "rod_cast_max_g") { value }
          dragMax: metafield(namespace: "specs", key: "rod_drag_max_kg") { value }
          supportedPe: metafield(namespace: "specs", key: "rod_pe_supported") { value }
          castingWeight: metafield(namespace: "specs", key: "rod_casting_weight") { value }
        }
        pageInfo { hasNextPage }
      }
    }
  }
}
